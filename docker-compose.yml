version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: asistente_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bd_asistente
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bd_asistente"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: asistente_backend
    ports:
      - "8001:8001"
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/bd_asistente
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AUTENTICACION_REQUERIDA=false
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  pgdata:
